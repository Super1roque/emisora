<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#f97316"/>
  <!-- antenna -->
  <line x1="16" y1="5" x2="16" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- left waves -->
  <path d="M11 9.5 Q8 12 11 14.5" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M8.5 7.5 Q4 12 8.5 16.5" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- right waves -->
  <path d="M21 9.5 Q24 12 21 14.5" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M23.5 7.5 Q28 12 23.5 16.5" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- radio body -->
  <rect x="7" y="15" width="18" height="12" rx="3" fill="white"/>
  <!-- speaker grille -->
  <rect x="9" y="18" width="7" height="6" rx="1.5" fill="#f97316"/>
  <!-- knobs -->
  <circle cx="20" cy="19" r="1.5" fill="#f97316"/>
  <circle cx="20" cy="23" r="1.5" fill="#f97316"/>
</svg>
